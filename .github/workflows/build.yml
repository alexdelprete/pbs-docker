---
name: Build and publish

'on':
  push:
    branches:
      - main
  schedule:
    # At 12:00 on Sunday.
    - cron: "0 12 * * 0"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-test:
    name: Build test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build
        run: docker build .

  build-release:
    name: Build and push
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:build

      - name: Determine Proxmox Backup Server version
        id: version
        run: |
          version=$(docker run --rm --entrypoint dpkg-query ${{ env.IMAGE }}:build \
            -f='${Version}' -W proxmox-backup-server | tr ':' '_')
          if [ -z "$version" ]; then
            echo "could not determine version" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Built Proxmox Backup Server ${version}"

      - name: Smoke test
        run: |
          docker run -d --name smoke --tmpfs /run:exec,mode=0755 -e PBS_ROOT_PASSWORD=smoketest ${{ env.IMAGE }}:build
          for i in $(seq 1 60); do
            if docker exec smoke curl -ksf -o /dev/null https://127.0.0.1:8007/; then
              echo "proxy answered after ${i}s"
              docker logs smoke
              docker rm -f smoke
              exit 0
            fi
            sleep 1
          done
          echo "proxy did not come up" >&2
          docker logs smoke
          docker rm -f smoke
          exit 1

      - name: Tag and push
        run: |
          docker tag ${{ env.IMAGE }}:build ${{ env.IMAGE }}:latest
          docker tag ${{ env.IMAGE }}:build ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          docker push ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          docker push ${{ env.IMAGE }}:latest

      - name: Summary
        run: |
          echo "Pushed \`${{ env.IMAGE }}:${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
